<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소수 찾기 슬라이드</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#1f3150;color:#fff;display:grid;place-items:center;min-height:100vh;text-align:center}h1{font-size:2.4rem;margin:0 0 .4em}p{opacity:.85}.n{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;margin:24px auto}.n span{width:44px;height:44px;border-radius:10px;background:#2d4673;display:grid;place-items:center;font-weight:700}.n span.p{background:#f6c344;color:#1f3150}</style></head>
<body><main><h1>소수 찾기 슬라이드</h1><p>1부터 50까지, 노란 칸이 소수예요</p><div class="n" id="n"></div><p>송쌤과학 실습 예시 페이지</p></main>
<script>const isP=k=>{if(k<2)return false;for(let i=2;i*i<=k;i++)if(k%i===0)return false;return true};for(let k=1;k<=50;k++){const s=document.createElement('span');s.textContent=k;if(isP(k))s.className='p';n.appendChild(s)}</script></body></html>
